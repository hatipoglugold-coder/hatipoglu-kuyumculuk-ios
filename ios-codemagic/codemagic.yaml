workflows:
  ios-app-store:
    name: HATIPOGLU iOS App Store ve TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      vars:
        BUNDLE_ID: "com.hatipoglu.gold"
      node: 20
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: 1. Temiz Kurulum
        script: |
          sed -i '' '/postinstall/d' package.json 2>/dev/null || sed -i '/postinstall/d' package.json 2>/dev/null || true
          npm install --legacy-peer-deps --ignore-scripts
      - name: 2. iOS Xcode Projesini Üret
        script: |
          rm -rf ios
          CI=1 npx --yes expo prebuild --platform ios --clean --no-install
      - name: 3. CocoaPods Bağımlılıklarını Kur
        script: |
          cd ios && pod install --repo-update
      - name: 4. Apple Developer Sertifika ve Profillerini Al
        script: |
          keychain initialize || true
          echo "App Store Connect API üzerinden provizyon profilleri alınıyor..."
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true
          keychain add-certificates || true
          
          PROFILES_COUNT=$(find /Users/builder/Library/MobileDevice/Provisioning\ Profiles/ -name "*.mobileprovision" 2>/dev/null | wc -l | tr -d ' ')
          echo "Yüklenen Apple Provizyon Profili Sayısı: $PROFILES_COUNT"
          
          MAIN_XCODEPROJ=$(find ios -maxdepth 1 -name "*.xcodeproj" 2>/dev/null | head -n 1)
          if [ "$PROFILES_COUNT" -gt 0 ] && [ -n "$MAIN_XCODEPROJ" ]; then
            echo "Signing main Xcode project: $MAIN_XCODEPROJ"
            xcode-project use-profiles --project "$MAIN_XCODEPROJ" --verbose || true
          else
            echo "Provizyon profili henüz indirilmedi veya bulunamadı; fallback arşivleme hazırlandı."
          fi
      - name: 5. iOS IPA Dosyasını Oluştur ve İmzala
        script: |
          mkdir -p build/ios/ipa build/ios/xcarchive
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          fi
          
          SCHEME="HatipogluGold"
          if ! xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -q "$SCHEME"; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -v -E 'Pods|boost|React|Yoga|DoubleConversion|fmt|glog|folly|hermes|RCT' | head -n 1)
          fi
          if [ -z "$SCHEME" ]; then
            SCHEME="HatipogluGold"
          fi
          
          echo "===> Hedef Workspace: $WORKSPACE"
          echo "===> Hedef Scheme: $SCHEME"
          
          BUILD_SUCCESS=0
          PROFILES_COUNT=$(find /Users/builder/Library/MobileDevice/Provisioning\ Profiles/ -name "*.mobileprovision" 2>/dev/null | wc -l | tr -d ' ')
          
          # 1. Deneme: Profil mevcutsa resmi Codemagic build-ipa
          if [ "$PROFILES_COUNT" -gt 0 ]; then
            echo "Apple provizyon profili ile imzalı derleme başlatılıyor..."
            if xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"; then
              BUILD_SUCCESS=1
            fi
          fi
          
          # 2. Deneme: Profil yoksa veya build-ipa hata verdiyse doğrudan xcodebuild arşivi ile IPA oluştur
          if [ "$BUILD_SUCCESS" -ne 1 ]; then
            echo "Doğrudan xcodebuild arşivi oluşturuluyor..."
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "build/ios/xcarchive/HatipogluGold.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO || true
            
            APP_PATH=$(find build/ios/xcarchive -name "*.app" 2>/dev/null | head -n 1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "Paket bulundu: $APP_PATH - IPA oluşturuluyor..."
              rm -rf /tmp/payload_build
              mkdir -p /tmp/payload_build/Payload
              cp -R "$APP_PATH" /tmp/payload_build/Payload/
              cd /tmp/payload_build
              zip -r -9 "$CM_BUILD_DIR/build/ios/ipa/HatipogluGold.ipa" Payload
              cd "$CM_BUILD_DIR"
              BUILD_SUCCESS=1
            fi
          fi
          
          # IPA kontrolü
          IPA_COUNT=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "IPA oluşturulamadı!"
            exit 1
          fi
          echo "Başarılı IPA oluşturuldu:"
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - acal4551@gmail.com
        notify:
          success: true
          failure: true
