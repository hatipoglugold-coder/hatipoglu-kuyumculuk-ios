workflows:
  ios-app-store:
    name: HATIPOGLU iOS App Store ve TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      vars:
        BUNDLE_ID: "com.hatipoglu.gold"
      node: 20
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: 1. Temiz Kurulum
        script: |
          sed -i '' '/postinstall/d' package.json 2>/dev/null || sed -i '/postinstall/d' package.json 2>/dev/null || true
          npm install --legacy-peer-deps --ignore-scripts
      - name: 2. iOS Xcode Projesini Üret
        script: |
          rm -rf ios
          CI=1 npx --yes expo prebuild --platform ios --clean --no-install
      - name: 3. CocoaPods Bağımlılıklarını Kur
        script: |
          cd ios && pod install --repo-update
      - name: 4. Apple Developer Sertifika ve Profillerini Al
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          XCODE_PROJECT=$(find ios -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -n "$XCODE_PROJECT" ]; then
            echo "Signing project: $XCODE_PROJECT"
            xcode-project use-profiles --project "$XCODE_PROJECT"
          else
            xcode-project use-profiles
          fi
      - name: 5. iOS IPA Dosyasını Oluştur ve İmzala
        script: |
          mkdir -p build/ios/ipa build/ios/xcarchive
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          XCODE_PROJECT=$(find ios -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          
          SCHEME="HatipogluGold"
          if ! xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -q "$SCHEME"; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -v -E 'Pods|boost|React|Yoga|DoubleConversion|fmt|glog|folly|hermes|RCT' | head -n 1)
          fi
          if [ -z "$SCHEME" ]; then
            SCHEME="HatipogluGold"
          fi
          
          echo "===> Hedef Workspace: $WORKSPACE"
          echo "===> Hedef Scheme: $SCHEME"
          
          # Codemagic CLI ile otomatik profillerle IPA üret
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --output-dir "build/ios/ipa" || \
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/ios/xcarchive/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO && \
          app-store-connect export-archive \
            --archive "build/ios/xcarchive/app.xcarchive" \
            --output-directory "build/ios/ipa"
          
          # IPA kontrolü
          IPA_COUNT=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | wc -l)
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "IPA oluşturulamadı!"
            exit 1
          fi
          echo "Başarılı IPA oluşturuldu:"
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - acal4551@gmail.com
        notify:
          success: true
          failure: true
